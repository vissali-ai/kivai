name: Asaas Sandbox - isolated billing checks

on:
  push:
    branches:
      - feature/asaas-recorrencia-segura-20261105
  workflow_dispatch:

permissions:
  contents: read

jobs:
  asaas-isolated:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install project dependencies
        run: npm ci
      - name: Validate billing webhooks and isolated SQL migration
        run: npm run test:billing
